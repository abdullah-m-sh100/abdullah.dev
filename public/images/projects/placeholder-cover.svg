<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Project cover placeholder">
  <!--
    Branded project-cover placeholder.

    The background is intentionally TRANSPARENT so the card surface behind it
    shows through — that is what makes this readable in both light and dark
    themes. Every colour below is translucent for the same reason; a solid fill
    would glare on a dark surface.

    TODO: replace with real project screenshots (WebP/AVIF, 16:10).
  -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <g stroke="#64748B" stroke-opacity="0.14" stroke-width="2">
    <path d="M0 125h1600M0 250h1600M0 375h1600M0 500h1600M0 625h1600M0 750h1600M0 875h1600"/>
    <path d="M125 0v1000M250 0v1000M375 0v1000M500 0v1000M625 0v1000M750 0v1000M875 0v1000M1000 0v1000M1125 0v1000M1250 0v1000M1375 0v1000M1475 0v1000"/>
  </g>

  <ellipse cx="800" cy="500" rx="430" ry="172" transform="rotate(-22 800 500)"
           fill="none" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="1198" cy="338" r="13" fill="#14B8A6" fill-opacity="0.75"/>

  <!-- Abstract interface: the same idea the hero panel draws, at cover scale. -->
  <g transform="translate(440 300)">
    <rect x="0" y="0" width="720" height="400" rx="24"
          fill="#64748B" fill-opacity="0.05"
          stroke="#64748B" stroke-opacity="0.22" stroke-width="2"/>

    <rect x="40" y="44" width="180" height="16" rx="8" fill="url(#accent)" fill-opacity="0.85"/>

    <rect x="40" y="92" width="420" height="12" rx="6" fill="#64748B" fill-opacity="0.24"/>
    <rect x="40" y="120" width="320" height="12" rx="6" fill="#64748B" fill-opacity="0.16"/>

    <g fill="#64748B" fill-opacity="0.1" stroke="#64748B" stroke-opacity="0.2" stroke-width="2">
      <rect x="40" y="170" width="196" height="130" rx="14"/>
      <rect x="262" y="170" width="196" height="130" rx="14"/>
      <rect x="484" y="170" width="196" height="130" rx="14"/>
    </g>

    <rect x="40" y="330" width="120" height="30" rx="15" fill="#3B82F6" fill-opacity="0.55"/>
    <rect x="176" y="330" width="96" height="30" rx="15"
          fill="none" stroke="#64748B" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
